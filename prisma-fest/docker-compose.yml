version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prisma_fest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisma_fest
      POSTGRES_PASSWORD: prisma_fest_secret
      POSTGRES_DB: prisma_fest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prisma_fest']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prisma_fest_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
